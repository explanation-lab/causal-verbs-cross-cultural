name: Check pilot study packages
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/core.cjs
      - run: node tests/factivity.cjs
      - run: node tests/chains.cjs
      - run: node --experimental-vm-modules tests/collection.cjs
      - run: python3 -m unittest discover -s tests -p '*_test.py'
      - run: python3 tools/stage_pages.py
